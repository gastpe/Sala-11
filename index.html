<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F7; --ink:#1C2528; --ink-soft:#5C6A70; --line:#DDE3E5;
    --teal:#0B5E59; --teal-dark:#073E3B;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Public Sans', system-ui, sans-serif; background:var(--bg); color:var(--ink);
    padding:24px;
  }
  .card{
    background:#fff; border-radius:18px; padding:40px 36px; width:100%; max-width:480px;
    box-shadow:0 8px 28px rgba(0,0,0,.08); text-align:center;
  }
  h1{ font-size:34px; font-weight:900; letter-spacing:.5px; color:var(--teal-dark); margin:0 0 6px; text-transform:uppercase; }
  p.sub{ font-size:15.5px; color:var(--ink-soft); margin:0 0 30px; }
  .opciones{ display:flex; flex-direction:column; gap:14px; }
  .opcion{
    display:flex; align-items:center; gap:14px; text-align:left; text-decoration:none; color:var(--ink);
    border:2px solid var(--line); border-radius:14px; padding:18px 20px; transition:border-color .15s, background .15s;
  }
  .opcion:hover{ border-color:var(--teal); background:#F5FAF9; }
  .opcion .icono{ font-size:32px; line-height:1; }
  .opcion .texto strong{ display:block; font-size:16.5px; font-weight:800; }
  .opcion .texto span{ display:block; font-size:13.2px; color:var(--ink-soft); margin-top:2px; }
  .cambiar{ margin-top:26px; font-size:12.8px; color:var(--ink-soft); }
  .cambiar a{ color:var(--teal); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sala 11</h1>
    <p class="sub">¿Quién sos?</p>
    <div class="opciones">
      <a class="opcion" href="medico.html" onclick="recordarEleccion('medico')">
        <span class="icono">👨‍⚕️</span>
        <span class="texto"><strong>Staff médico</strong><span>Datos clínicos, indicaciones, pendientes, reportes</span></span>
      </a>
      <a class="opcion" href="enfermeria.html" onclick="recordarEleccion('enfermeria')">
        <span class="icono">🩺</span>
        <span class="texto"><strong>Enfermería</strong><span>Mapa de camas, ingresos, movimientos</span></span>
      </a>
    </div>
    <p class="cambiar">La próxima vez te va a llevar directo a tu vista. <a href="#" onclick="olvidarEleccion(); return false;">Volver a preguntar siempre</a></p>
  </div>
<script>
function recordarEleccion(cual){
  try{ localStorage.setItem('sala11_rol', cual); }catch(e){}
}
function olvidarEleccion(){
  try{ localStorage.removeItem('sala11_rol'); }catch(e){}
  alert('Listo, la próxima vez te va a volver a preguntar.');
}
(function(){
  try{
    const rol = localStorage.getItem('sala11_rol');
    if(rol==='medico') location.replace('medico.html');
    else if(rol==='enfermeria') location.replace('enfermeria.html');
  }catch(e){}
})();
</script>
</body>
</html>
